<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figuras por Reflexión</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --tx:#1d2330; --mut:#667085; --pri:#2f5bea; --ok:#127a3f; --err:#b42318; --bd:#dde1e8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--tx); }
  header { padding:20px 24px; background:#1d2330; color:#fff; }
  header h1 { margin:0; font-size:20px; } header p { margin:4px 0 0; color:#b8c0cc; font-size:13px; }
  main { max-width:1100px; margin:0 auto; padding:20px; display:grid; gap:16px; grid-template-columns:1fr 1fr; }
  section { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:16px; }
  section.full { grid-column:1 / -1; }
  h2 { font-size:15px; margin:0 0 12px; }
  label { display:block; font-size:12px; color:var(--mut); margin:8px 0 4px; }
  input, select, textarea { width:100%; padding:8px; border:1px solid var(--bd); border-radius:6px; font:inherit; }
  textarea { font-family:ui-monospace,Consolas,monospace; font-size:13px; min-height:230px; }
  button { margin-top:12px; padding:8px 14px; border:0; border-radius:6px; background:var(--pri); color:#fff; font-weight:600; cursor:pointer; }
  button.sec { background:#475467; }
  pre { background:#0f1420; color:#d5dbe5; padding:12px; border-radius:8px; overflow:auto; font-size:12px; max-height:340px; white-space:pre-wrap; }
  .chips span { display:inline-block; padding:3px 8px; margin:2px; border-radius:999px; font-size:12px; background:#e8edff; color:#2f5bea; }
  .chips span.GROOVY { background:#e6f6ec; color:var(--ok); }
  .big { font-size:22px; font-weight:700; } .err { color:var(--err); }
  @media (max-width:800px){ main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Figuras geométricas creadas por reflexión</h1>
  <p>ISWZ2202 · Diseño y Arquitectura de Software · Java + Spring Boot + Groovy</p>
</header>
<main>
  <section class="full">
    <h2>Figuras disponibles <small style="color:var(--mut)">(azul = nativa Java · verde = Groovy)</small></h2>
    <div id="chips" class="chips"></div>
  </section>

  <section>
    <h2>1. Crear figura por nombre</h2>
    <label>Figura (nombre de la clase)</label>
    <select id="figura"></select>
    <div id="params"></div>
    <button onclick="calcular()">Crear y calcular</button>
    <button class="sec" onclick="inspeccionar()">Inspeccionar clase</button>
    <div id="resumen" style="margin-top:12px"></div>
  </section>

  <section>
    <h2>Respuesta del servidor</h2>
    <pre id="salida">—</pre>
  </section>

  <section>
    <h2>2. Cargar figura nueva en Groovy</h2>
    <textarea id="codigo">import com.udla.figuras.modelo.Figura

class Pentagono implements Figura {
    double lado

    double area() {
        return 0.25 * Math.sqrt(5 * (5 + 2 * Math.sqrt(5))) * lado * lado
    }

    double perimetro() {
        return 5 * lado
    }
}</textarea>
    <button onclick="cargarGroovy()">Compilar y registrar</button>
  </section>

  <section>
    <h2>3. Extra: servicio externo</h2>
    <label>URL del servicio (vacío = servicio simulado incluido)</label>
    <input id="url" placeholder="http://localhost:8080/api/catalogo-remoto/figuras">
    <button class="sec" onclick="verExternas()">Ver catálogo remoto</button>
    <button onclick="importar()">Importar figuras</button>
  </section>
</main>

<script>
let figuras = [];
const $ = id => document.getElementById(id);
const mostrar = obj => $('salida').textContent = JSON.stringify(obj, null, 2);

async function api(url, opts) {
  const r = await fetch(url, opts);
  const data = await r.json();
  mostrar(data);
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

async function refrescar(seleccion) {
  figuras = await (await fetch('/api/figuras')).json();
  $('chips').innerHTML = figuras.map(f => `<span class="${f.origen}">${f.nombre}</span>`).join('');
  $('figura').innerHTML = figuras.map(f => `<option>${f.nombre}</option>`).join('');
  if (seleccion) $('figura').value = seleccion;
  pintarParametros();
}

function pintarParametros() {
  const f = figuras.find(x => x.nombre === $('figura').value);
  $('params').innerHTML = (f ? f.parametros : []).map(p =>
    `<label>${p}</label><input data-p="${p}" type="number" step="any" value="5">`).join('');
}
$('figura').addEventListener('change', pintarParametros);

async function calcular() {
  const parametros = {};
  document.querySelectorAll('#params input').forEach(i => parametros[i.dataset.p] = i.value);
  try {
    const r = await api('/api/figuras/crear', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ figura: $('figura').value, parametros }) });
    $('resumen').innerHTML = `<div class="big">Área: ${r.area}</div><div class="big">Perímetro: ${r.perimetro}</div>
      <small style="color:var(--mut)">${r.clase} · ${r.origen}</small>`;
  } catch (e) { $('resumen').innerHTML = `<span class="err">${e.message}</span>`; }
}

async function inspeccionar() {
  try { await api(`/api/figuras/${$('figura').value}/info`); } catch (e) {}
}

async function cargarGroovy() {
  try {
    const r = await api('/api/figuras/groovy', { method:'POST', headers:{'Content-Type':'text/plain'}, body: $('codigo').value });
    await refrescar(r.figura.nombre);
  } catch (e) {}
}

const q = () => $('url').value ? '?url=' + encodeURIComponent($('url').value) : '';
async function verExternas() { try { await api('/api/figuras/externas' + q()); } catch (e) {} }
async function importar() {
  try { await api('/api/figuras/externas/importar' + q(), { method:'POST' }); await refrescar(); } catch (e) {}
}

refrescar();
</script>
</body>
</html>
