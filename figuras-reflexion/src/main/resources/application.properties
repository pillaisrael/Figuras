spring.application.name=figuras-reflexion
server.port=8080

# Carpeta donde se guardan las figuras Groovy cargadas (se recompilan al iniciar)
figuras.carpeta-dinamica=figuras-dinamicas

# EXTRA: servicio externo que publica figuras nuevas (JSON con codigo Groovy).
# Por defecto usa el servicio simulado incluido en esta misma app.
figuras.servicio-externo.url=http://localhost:${server.port}/api/catalogo-remoto/figuras
